# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=hospitality-platform

# Database Configuration (Defaults to PostgreSQL, can override via ENV vars)
# DB_URL=jdbc:postgresql://localhost:5432/hospitality_db
# DB_DRIVER=org.postgresql.Driver
# DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${DB_URL:jdbc:h2:mem:hospitality_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a626a578943075626da88c08f0706a5b288c3f69cfd9e8c4e650043ff78f246}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION:86400000}

# AI Chatbot Configuration
ai.api.key=${AI_API_KEY:${GEMINI_API_KEY:}}
ai.model.name=${AI_MODEL:gemini-1.5-flash}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.hospitality.platform=INFO

# Mail Configuration (SMTP Settings for Sending Real Booking Receipts)
spring.mail.host=${MAIL_HOST:smtp.ethereal.email}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:xr6ejbrqfc7ptmz2@ethereal.email}
spring.mail.password=${MAIL_PASSWORD:c61HnT2RAKD8JUaaJM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

